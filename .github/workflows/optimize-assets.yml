name: Optimize static image assets

on:
  push:
    branches:
      - main
      - perf-optimization
    paths:
      - 'index.html'
      - 'script.js'
      - 'styles.css'
      - 'landing.css'
      - 'assets/*.png'
      - 'assets/*.jpg'
      - 'assets/*.jpeg'
      - 'tools/optimize_assets.py'
      - '.github/workflows/optimize-assets.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate responsive WebP assets
        run: python tools/optimize_assets.py

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/optimized index.html
          if git diff --cached --quiet; then
            echo "Optimized assets are already up to date."
            exit 0
          fi
          git commit -m "Generate optimized WebP assets"
          git push origin perf-optimization
